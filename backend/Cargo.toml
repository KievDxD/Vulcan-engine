[package]
name = "vulcan-engine"
version = "1.0.0"
edition = "2021"
description = "VULCAN // ENGINE - Ultra-low latency distributed rate-limiting, telemetry ingestion, and Z-Score anomaly detection engine"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
dashmap = "5"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["fs", "cors"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
